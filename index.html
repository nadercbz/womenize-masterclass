<head>
<meta charset="utf-8">

<title>Masterclass Portraits</title>

<style>
/* Layout: a dark studio wall. Sticky name rail on top, justified rows of photos keep every frame uncropped and in shooting order. */
:root {
  --bg: #121211;
  --wall: #1a1918;
  --line: #2b2927;
  --fg: #ece8e2;
  --muted: #99938b;
  --dim: #6d6862;
  --yellow: #e6c449;
  --green: #5cbf6e;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Manrope", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --rowh: 280px;
  --gap: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
.wrap {
  max-width: 1480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.intro { padding-block: 40px 22px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px 40px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h1 { font-family: var(--display); font-weight: 650; font-size: clamp(34px, 5.4vw, 64px); line-height: .98; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px; }
.facts b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.dot.y { background: var(--yellow); }
.dot.g { background: var(--green); }

/* name rail */
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-block: 1px solid var(--line);
}
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 10px; scroll-padding-inline: 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; display: inline-flex; align-items: baseline; gap: 8px;
  font: 500 14px/1 var(--body); color: var(--muted);
  background: transparent; border: 1px solid transparent; border-radius: 999px;
  padding: 9px 14px; cursor: pointer; white-space: nowrap;
  transition: color .15s, background-color .15s, border-color .15s;
}
.tab:hover { color: var(--fg); background: var(--wall); }
.tab:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.tab[aria-selected="true"] { color: var(--bg); background: var(--fg); }
.tab .n { font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] .n { color: #55504a; }
.tab .dot { margin-right: 0; align-self: center; }
.sep { flex: 0 0 1px; background: var(--line); margin: 6px 6px; }

/* view */
.head { padding-block: 34px 18px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.head h2 { font-family: var(--display); font-weight: 650; font-size: clamp(26px, 3.4vw, 40px); letter-spacing: -.015em; line-height: 1.05; margin: 0; }
.head p { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

.grid { display: flex; flex-wrap: wrap; gap: var(--gap); padding-bottom: 64px; }
.grid::after { content: ""; flex-grow: 1000000; }
.card {
  position: relative; flex-grow: var(--r); flex-basis: calc(var(--r) * var(--rowh));
  margin: 0; padding: 0; border: 0; background: var(--wall); cursor: zoom-in;
  border-radius: 3px; overflow: hidden; display: block; color: inherit; text-align: left;
}
.card img {
  display: block; width: 100%; height: auto; aspect-ratio: var(--w) / var(--h);
  object-fit: cover; transition: transform .5s cubic-bezier(.2,.7,.2,1), filter .3s;
}
.card:hover img { transform: scale(1.025); filter: brightness(1.06); }
.card:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.badge {
  position: absolute; top: 10px; right: 10px; display: inline-flex; align-items: center; gap: 6px;
  font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: #10210f;
  background: var(--green); border-radius: 999px; padding: 6px 9px;
}
.who {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 12px 10px;
  background: linear-gradient(to top, rgba(10,10,9,.72), rgba(10,10,9,0));
  font: 600 13px/1.2 var(--body); color: #f3efe9;
  display: flex; justify-content: space-between; gap: 8px; align-items: end;
}
.who span:last-child { font: 400 11px/1.2 var(--mono); color: #c9c3bb; }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 50; background: rgba(9,9,8,.97); display: grid; grid-template-rows: auto 1fr auto; }
.lb-top, .lb-bottom {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.lb-top { padding-block: calc(env(safe-area-inset-top, 0px) + 12px) 8px; }
.lb-bottom { padding-block: 8px calc(env(safe-area-inset-bottom, 0px) + 14px); color: var(--muted); font-size: 13px; }
.lb-title { font-family: var(--display); font-weight: 650; font-size: 20px; }
.lb-count { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lb-stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 64px; touch-action: pan-y; }
.lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; border-radius: 2px; }
.btn {
  background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 999px;
  width: 44px; height: 44px; display: inline-grid; place-items: center; cursor: pointer;
  transition: background-color .15s, border-color .15s;
}
.btn:hover { background: var(--wall); border-color: #45413d; }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav { position: absolute; top: 50%; transform: translateY(-50%); }
.nav.prev { left: max(10px, env(safe-area-inset-left, 0px)); }
.nav.next { right: max(10px, env(safe-area-inset-right, 0px)); }
.file { font-family: var(--mono); color: var(--fg); }
.tagchip { display: inline-flex; align-items: center; font-size: 13px; }
.hint { color: var(--dim); }

@media (max-width: 720px) {
  :root { --rowh: 150px; --gap: 6px; }
  .intro { padding-block: 26px 16px; }
  .lb-stage { padding: 0 8px; }
  .nav { display: none; }
  .hint { display: none; }
  .who { padding: 18px 8px 6px; font-size: 12px; }
  .who span:last-child { display: none; }
  .badge { top: 6px; right: 6px; padding: 5px 7px; font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* lock screen */
.lock { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-block: 40px; }
.lock-card { width: 100%; max-width: 420px; margin: 0; }
.lock h1 { margin-bottom: 16px; }
.lock-text { color: var(--muted); margin: 0 0 28px; }
.lock-form { display: grid; gap: 12px; }
.lock .f { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.lock input[type="password"] {
  width: 100%; font: 500 17px/1.2 var(--body); color: var(--fg); background: var(--wall);
  border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; outline: none; transition: border-color .15s;
}
.lock input[type="password"]:focus { border-color: var(--fg); }
.lock input[aria-invalid="true"] { border-color: #d9695f; }
.remember { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; cursor: pointer; margin-top: 2px; }
.remember input { width: 18px; height: 18px; margin: 0; accent-color: var(--fg); }
.go {
  margin-top: 6px; font: 600 15px/1 var(--body); color: var(--bg); background: var(--fg);
  border: 0; border-radius: 999px; padding: 16px 20px; cursor: pointer; transition: opacity .15s;
}
.go:disabled { opacity: .6; cursor: progress; }
.go:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.err { min-height: 1.5em; margin: 2px 0 0; color: #e58a80; font-size: 14px; }
.lockbtn {
  font: 500 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 7px 11px; cursor: pointer;
  transition: color .15s, border-color .15s;
}
.lockbtn:hover { color: var(--fg); border-color: #45413d; }
.lockbtn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.card img { opacity: 0; transition: transform .5s cubic-bezier(.2,.7,.2,1), filter .3s, opacity .35s; }
.card img.ok { opacity: 1; }
.lb-stage[data-msg]::after { content: attr(data-msg); position: absolute; font: 400 12px/1 var(--mono); letter-spacing: .06em; color: var(--dim); }
</style>
</head>
<body>
<div class="wrap lock" id="lock" hidden>
  <form class="lock-card" id="lockForm">
    <p class="eyebrow">Studio-Shooting · geschützte Galerie</p>
    <h1>Masterclass Portraits</h1>
    <p class="lock-text">Bitte gib das Passwort ein, um die Fotos zu sehen.</p>
    <div class="lock-form">
      <label class="f" for="pw">Passwort</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required aria-describedby="err">
      <label class="remember"><input type="checkbox" id="remember"> Auf diesem Gerät angemeldet bleiben</label>
      <button class="go" id="go" type="submit">Galerie öffnen</button>
      <p class="err" id="err" role="alert"></p>
    </div>
  </form>
</div>
<noscript><p class="wrap" style="padding-block:40px">Bitte JavaScript aktivieren, um die Galerie zu öffnen.</p></noscript>
<div id="app" hidden>
<div class="wrap intro">
  <div>
    <p class="eyebrow">Studio-Shooting · bearbeitete Auswahl</p>
    <h1>Masterclass Portraits</h1>
  </div>
  <ul class="facts" id="facts"></ul>
</div>

<div class="rail">
  <nav class="wrap tabs" id="tabs" role="tablist" aria-label="Personen"></nav>
</div>

<main class="wrap">
  <div class="head"><h2 id="vt"></h2><p id="vs"></p></div>
  <div class="grid" id="grid" role="list"></div>
</main>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-labelledby="lbTitle" hidden>
  <div class="lb-top">
    <div><div class="lb-title" id="lbTitle"></div><div class="lb-count" id="lbCount"></div></div>
    <button class="btn" id="lbClose" type="button" aria-label="Schließen">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="lb-stage" id="lbStage">
    <button class="btn nav prev" id="lbPrev" type="button" aria-label="Vorheriges Foto">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <img id="lbImg" alt="">
    <button class="btn nav next" id="lbNext" type="button" aria-label="Nächstes Foto">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="lb-bottom">
    <span><span class="file" id="lbFile"></span> &nbsp; <span class="tagchip" id="lbTag"></span></span>
    <span class="hint">← → blättern · Esc schließen</span>
  </div>
</div>

<script>
(function () {
  /* Password gate: the gallery data and every photo are AES-GCM encrypted.
     The key comes from the password via PBKDF2; nothing readable is on the server. */
  const $ = id => document.getElementById(id);
  const vault = JSON.parse($("vault").textContent);
  const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = u => { let s = ""; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  const SK = "mc-gallery-key";
  let key = null, started = false;

  function storeGet() {
    for (const name of ["sessionStorage", "localStorage"]) {
      try {
        const v = JSON.parse(window[name].getItem(SK) || "null");
        if (v && v.s === vault.s && v.k) return v.k;
      } catch (e) {}
    }
    return null;
  }
  function storeSet(raw, remember) {
    const v = JSON.stringify({ s: vault.s, k: raw });
    try { sessionStorage.setItem(SK, v); } catch (e) {}
    try { if (remember) localStorage.setItem(SK, v); else localStorage.removeItem(SK); } catch (e) {}
  }
  function storeClear() {
    try { sessionStorage.removeItem(SK); } catch (e) {}
    try { localStorage.removeItem(SK); } catch (e) {}
  }

  const decrypt = (k, bytes) => crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes.subarray(0, 12) }, k, bytes.subarray(12));
  async function openVault(k) {
    const plain = await decrypt(k, b64d(vault.c));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  async function fromPassword(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64d(vault.s), iterations: vault.i, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  const fromRaw = raw => crypto.subtle.importKey("raw", b64d(raw), "AES-GCM", true, ["decrypt"]);

  function showLock() {
    $("app").hidden = true;
    $("lock").hidden = false;
    setTimeout(() => $("pw").focus(), 0);
  }

  async function boot() {
    if (!window.crypto || !crypto.subtle || !window.TextDecoder) {
      showLock();
      $("err").textContent = "Dieser Browser kann die Galerie nicht öffnen. Bitte einen aktuellen Browser verwenden.";
      $("go").disabled = true;
      return;
    }
    const raw = storeGet();
    if (raw) {
      try { const k = await fromRaw(raw); const people = await openVault(k); key = k; start(people); return; }
      catch (e) { storeClear(); }
    }
    showLock();
  }

  $("lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    const pwEl = $("pw"), go = $("go"), err = $("err");
    const pw = pwEl.value.trim();
    if (!pw) { pwEl.focus(); return; }
    go.disabled = true; go.textContent = "Prüfe …"; err.textContent = ""; pwEl.removeAttribute("aria-invalid");
    try {
      const k = await fromPassword(pw);
      const people = await openVault(k);
      key = k;
      storeSet(b64e(new Uint8Array(await crypto.subtle.exportKey("raw", k))), $("remember").checked);
      pwEl.value = "";
      start(people);
    } catch (x) {
      err.textContent = "Das Passwort stimmt nicht. Bitte noch einmal versuchen.";
      pwEl.setAttribute("aria-invalid", "true");
      pwEl.select();
    } finally {
      go.disabled = false; go.textContent = "Galerie öffnen";
    }
  });

  /* encrypted image loading */
  const cache = new Map();
  function load(path) {
    let p = cache.get(path);
    if (!p) {
      p = fetch(path)
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
        .then(buf => decrypt(key, new Uint8Array(buf)))
        .then(plain => URL.createObjectURL(new Blob([plain], { type: "image/jpeg" })));
      cache.set(path, p);
      p.catch(() => { if (cache.get(path) === p) cache.delete(path); });
    }
    return p;
  }
  const bigOrder = [];
  function loadBig(path) {
    const i = bigOrder.indexOf(path);
    if (i >= 0) bigOrder.splice(i, 1);
    bigOrder.push(path);
    while (bigOrder.length > 24) {
      const old = bigOrder.shift(), pr = cache.get(old);
      cache.delete(old);
      if (pr) pr.then(u => { if ($("lbImg").dataset.k !== old) URL.revokeObjectURL(u); }, () => {});
    }
    return load(path);
  }
  function paint(im) {
    load(im.dataset.k).then(u => {
      im.addEventListener("load", () => im.classList.add("ok"), { once: true });
      im.src = u;
    }, () => {});
  }
  const io = "IntersectionObserver" in window
    ? new IntersectionObserver(entries => {
        entries.forEach(en => { if (en.isIntersecting) { io.unobserve(en.target); paint(en.target); } });
      }, { rootMargin: "900px 0px" })
    : null;

  function start(people) {
    if (started) return;
    started = true;
    $("lock").hidden = true;
    $("app").hidden = false;

    const persons = people.filter(p => !p.group && !p.event);
    const group = people.find(p => p.group);
    const event = people.find(p => p.event);
    const all = people.filter(p => !p.event).flatMap(p => p.photos.map(ph => Object.assign({ who: p.name }, ph)));
    const yellow = all.filter(ph => ph.y);
    const greens = all.filter(ph => ph.g).length;

    const views = [
      { id: "gelb", label: "Gelb markiert", dot: "y", title: "Alle gelb markierten Fotos", photos: yellow, showWho: true },
      { id: "gruen", label: "Grün markiert", dot: "g", title: "Alle grün markierten Fotos", photos: all.filter(ph => ph.g), showWho: true, noBadge: true },
    ];
    if (group) views.push({ id: "gruppe", label: "Gruppe", title: "Gruppenfotos", photos: group.photos.map(ph => Object.assign({ who: "Gruppe" }, ph)), showWho: false });
    if (event) views.push({ id: "event", label: "Eventfotos", title: "Eventfotos", photos: event.photos.map(ph => Object.assign({ who: "Eventfotos" }, ph)), showWho: false });
    views.push({ sep: true });
    persons.forEach(p => views.push({
      id: p.id, label: p.name, num: p.num, title: p.name,
      photos: p.photos.map(ph => Object.assign({ who: p.name }, ph)), showWho: false
    }));

    const tabs = $("tabs"), grid = $("grid");

    $("facts").innerHTML =
      `<li><b>${persons.length}</b> Personen</li>` +
      `<li><b>${all.length}</b> Portraits</li>` +
      (event ? `<li><b>${event.photos.length}</b> Eventfotos</li>` : "") +
      `<li><span class="dot y"></span><b>${yellow.length}</b> gelb · Re Use</li>` +
      `<li><span class="dot g"></span><b>${greens}</b> grün · Final Videos</li>` +
      `<li><button class="lockbtn" id="lockBtn" type="button">Sperren</button></li>`;
    $("lockBtn").addEventListener("click", () => { storeClear(); location.reload(); });

    views.forEach(v => {
      if (v.sep) { const s = document.createElement("span"); s.className = "sep"; s.setAttribute("aria-hidden", "true"); tabs.appendChild(s); return; }
      const b = document.createElement("button");
      b.type = "button"; b.className = "tab"; b.setAttribute("role", "tab"); b.id = "tab-" + v.id; b.dataset.view = v.id;
      b.innerHTML = (v.dot ? `<span class="dot ${v.dot}"></span>` : "") + `<span>${v.label}</span><span class="n">${v.photos.length}</span>`;
      b.addEventListener("click", () => { if (location.hash !== "#" + v.id) location.hash = v.id; else show(v.id); });
      tabs.appendChild(b);
    });

    let current = null;
    function show(id) {
      const v = views.find(x => x.id === id) || views[0];
      current = v;
      tabs.querySelectorAll(".tab").forEach(t => {
        const on = t.dataset.view === v.id;
        t.setAttribute("aria-selected", on ? "true" : "false");
        t.tabIndex = on ? 0 : -1;
        if (on) t.scrollIntoView({ block: "nearest", inline: "nearest" });
      });
      $("vt").textContent = v.title;
      const g = v.photos.filter(p => p.g).length;
      $("vs").textContent = v.photos.length + (v.photos.length === 1 ? " Foto" : " Fotos") + (g && !v.showWho ? " · " + g + " grün markiert" : "");
      if (io) io.disconnect();
      grid.innerHTML = "";
      const frag = document.createDocumentFragment();
      v.photos.forEach((ph, i) => {
        const c = document.createElement("button");
        c.type = "button"; c.className = "card"; c.setAttribute("role", "listitem");
        c.style.setProperty("--r", (ph.w / ph.h).toFixed(4));
        c.style.setProperty("--w", ph.w); c.style.setProperty("--h", ph.h);
        c.setAttribute("aria-label", `${ph.who}, ${ph.file} öffnen`);
        c.innerHTML =
          `<img data-k="${ph.t}" width="${ph.w}" height="${ph.h}" alt="" decoding="async">` +
          (ph.g && !v.noBadge ? `<span class="badge">Final</span>` : "") +
          (v.showWho ? `<span class="who"><span>${ph.who}</span><span>${ph.file}</span></span>` : "");
        c.addEventListener("click", () => open(i));
        frag.appendChild(c);
      });
      grid.appendChild(frag);
      grid.querySelectorAll("img[data-k]").forEach(im => { if (io) io.observe(im); else paint(im); });
    }

    tabs.addEventListener("keydown", e => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const list = [...tabs.querySelectorAll(".tab")];
      const i = list.findIndex(t => t.getAttribute("aria-selected") === "true");
      const n = list[(i + (e.key === "ArrowRight" ? 1 : -1) + list.length) % list.length];
      n.focus(); n.click(); e.preventDefault();
    });

    /* lightbox */
    const lb = $("lb"), img = $("lbImg"), stage = $("lbStage");
    let idx = 0, lastFocus = null, token = 0;
    function render() {
      const ph = current.photos[idx], my = ++token;
      img.dataset.k = ph.l; img.removeAttribute("src"); img.alt = "";
      stage.dataset.msg = "Lädt …";
      loadBig(ph.l).then(u => {
        if (my !== token) return;
        img.src = u; img.alt = `Portrait ${ph.who} ${ph.file}`;
        delete stage.dataset.msg;
      }, () => { if (my === token) stage.dataset.msg = "Foto konnte nicht geladen werden"; });
      $("lbTitle").textContent = ph.who;
      $("lbCount").textContent = `${idx + 1} / ${current.photos.length}`;
      $("lbFile").textContent = ph.file;
      $("lbTag").innerHTML = ph.g ? `<span class="dot g"></span>grün · Final Videos` : (ph.y ? `<span class="dot y"></span>gelb · Re Use` : "");
      [idx - 1, idx + 1].forEach(j => {
        const p = current.photos[(j + current.photos.length) % current.photos.length];
        if (p && p !== ph) loadBig(p.l).catch(() => {});
      });
    }
    function open(i) { idx = i; lastFocus = document.activeElement; lb.hidden = false; document.body.style.overflow = "hidden"; render(); $("lbClose").focus(); }
    function close() { lb.hidden = true; document.body.style.overflow = ""; token++; if (lastFocus) lastFocus.focus(); }
    function step(d) { idx = (idx + d + current.photos.length) % current.photos.length; render(); }
    $("lbClose").addEventListener("click", close);
    $("lbPrev").addEventListener("click", () => step(-1));
    $("lbNext").addEventListener("click", () => step(1));
    stage.addEventListener("click", e => { if (e.target.id === "lbStage") close(); });
    document.addEventListener("keydown", e => {
      if (lb.hidden) return;
      if (e.key === "Escape") close();
      else if (e.key === "ArrowRight") step(1);
      else if (e.key === "ArrowLeft") step(-1);
    });
    let sx = null;
    stage.addEventListener("pointerdown", e => { sx = e.clientX; });
    stage.addEventListener("pointerup", e => {
      if (sx === null) return; const dx = e.clientX - sx; sx = null;
      if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1);
    });

    function route() { show(location.hash.slice(1)); }
    window.addEventListener("hashchange", route);
    route();
  }

  boot();
})();
</script>
</body>
</html>
